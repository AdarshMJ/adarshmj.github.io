<ol class="selected-research-list">
  {% for pub in site.data.publications limit:3 %}
  <li>
    <a href="{{ pub.url }}"{% unless pub.url contains site.url %} target="_blank" rel="noopener noreferrer"{% endunless %}>{{ pub.title }}</a>
    <span class="selected-research-venue">{{ pub.venue }} {{ pub.year }}</span>
  </li>
  {% endfor %}
</ol>

<p class="all-publications-link"><a href="{{ '/publications/' | prepend: site.baseurl }}">View all publications →</a></p>
